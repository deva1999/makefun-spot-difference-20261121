<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spot the Difference — Harbour, Market &amp; Garden</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-group">
      <span id="game-title">Spot the Difference</span>
      <span id="round-label">Round 1 of 3 · Harbour at Dusk</span>
    </div>
    <div class="hud-group">
      <span id="counter">Found 0 / 7</span>
      <span id="timer">02:30</span>
    </div>
    <div class="hud-group">
      <span id="score">Score 0</span>
      <button id="hint-btn" type="button">Hint (3)</button>
      <button id="mute-btn" type="button">Sound: on</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" width="1200" height="520"></canvas>
    <div id="overlay" class="overlay"></div>
  </div>

  <footer id="status">Two pictures, side by side — almost the same. Click a difference on either picture.</footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
